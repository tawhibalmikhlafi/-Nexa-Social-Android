apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Supabase credentials are read from the git-ignored local.properties file so no secret is
// committed to the repository or embedded in a resource file. The URL is public; the key is not.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def supabaseUrl = localProperties.getProperty('SUPABASE_URL', 'https://mqtggplwghyidmchzovc5.supabase.co')
def supabaseAnonKey = localProperties.getProperty('SUPABASE_ANON_KEY', '')
def escapedSupabaseUrl = supabaseUrl.replace('\\', '\\\\').replace('"', '\\"')
def escapedSupabaseKey = supabaseAnonKey.replace('\\', '\\\\').replace('"', '\\"')

// Release signing is configured through local.properties so the keystore and its passwords are
// never committed. When they are absent the release variant is built unsigned, which keeps CI and
// local `assembleRelease` runs working while the Play Store build still gets a signed artifact.
def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE')
def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS')
def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD')
def hasReleaseKeystore = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.nexa.social"
    compileSdk 35

    defaultConfig {
        applicationId "com.nexa.social"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SUPABASE_URL", "\"${escapedSupabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${escapedSupabaseKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Supabase Auth/Storage are consumed through their documented REST API with OkHttp.
    // This avoids pulling a Kotlin 2.0-compiled Supabase SDK into a Kotlin 1.9.24 build.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'


    // Modern Google Sign-In through Credential Manager.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

